<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function(){
    try{
      var savedTheme = localStorage.getItem('pacuka-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if(savedTheme === 'dark' || (!savedTheme && prefersDark)){ document.documentElement.setAttribute('data-theme','dark'); }
      var savedLang = localStorage.getItem('pacuka-lang');
      if(savedLang === 'hu'){ document.documentElement.setAttribute('lang','hu'); }
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacuka - home lab, apps & translating</title>
<meta name="description" content="Pacuka's personal site: home lab tinkering, open-source apps like Firka, Android ROMs, and Hungarian localization.">
<meta name="theme-color" content="#e9ebee" id="theme-color">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pacuka.hu/">
<meta property="og:title" content="Pacuka">
<meta property="og:description" content="Home lab tinkerer, indie developer, translator.">
<link rel="canonical" href="https://pacuka.hu/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    Concept: Pacuka's home lab. Projects are units mounted in a rack, each
    with a label-maker tape and a status LED (green = active, amber = work
    in progress, off = archived). Label tape is the recurring motif.
    Accent: OM3 multimode fiber aqua. LED colors carry status only.

    Radius rule: buttons and the language switch are pills, rack hardware
    is 4-8px, label tape is 2px.
  */
  :root{
    --bg:#e9ebee;
    --ink:#15181d;
    --ink-2:#4f5663;
    --ink-3:#7c8390;
    --rule:#cfd4da;
    --panel:#f6f7f8;
    --panel-edge:#cdd2d8;
    --rack:#d9dde2;
    --hole:#b9bfc7;
    --accent:#0a7380;
    --accent-strong:#0e9aa7;
    --tape:#fbfbf7;
    --tape-ink:#121417;
    --led-off:#a3a9b2;
    --led-green:#22b14c;
    --led-amber:#f0a020;
    --header:rgba(233,235,238,0.86);
    --ease:cubic-bezier(.2,.9,.25,1);
    --gutter:clamp(16px, 5vw, 56px);
    --mono:"IBM Plex Mono", ui-monospace, monospace;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#1a1d22;
    --ink:#e8eaee;
    --ink-2:#a6adb9;
    --ink-3:#737b88;
    --rule:#2f343c;
    --panel:#252930;
    --panel-edge:#363b44;
    --rack:#121418;
    --hole:#2a2e35;
    --accent:#3cc6cf;
    --accent-strong:#3cc6cf;
    --led-off:#3d424a;
    --header:rgba(26,29,34,0.86);
    color-scheme:dark;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Schibsted Grotesk", system-ui, sans-serif;
    font-size:18px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    transition:background-color .4s ease, color .4s ease;
  }
  a{color:inherit;}
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  h1,h2,h3{text-wrap:balance;}
  p{text-wrap:pretty;}
  .wrap{max-width:1180px; margin-inline:auto; padding-inline:var(--gutter);}
  :focus-visible{outline:2px solid var(--accent-strong); outline-offset:3px; border-radius:4px;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .skip-link{
    position:absolute; left:16px; top:-60px; z-index:300;
    background:var(--ink); color:var(--bg); font-weight:600; font-size:15px;
    padding:8px 16px; border-radius:100px; text-decoration:none; transition:top .2s ease;
  }
  .skip-link:focus-visible{top:12px;}

  /* Label-maker tape */
  .tape{
    display:inline-block; font-family:var(--mono); font-weight:500; font-size:14px; letter-spacing:.01em;
    background:var(--tape); color:var(--tape-ink); padding:3px 10px 3px;
    border-radius:2px; line-height:1.4; white-space:nowrap;
    box-shadow:0 1px 0 rgba(0,0,0,.10), 0 2px 5px -1px rgba(0,0,0,.14);
  }
  [data-theme="dark"] .tape{box-shadow:0 1px 0 rgba(0,0,0,.4), 0 2px 6px -1px rgba(0,0,0,.5);}

  .tlink{
    color:var(--accent); font-weight:600; text-decoration:underline;
    text-decoration-thickness:1.5px; text-underline-offset:4px;
    text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent);
    transition:text-decoration-color .2s ease;
  }
  .tlink:hover{text-decoration-color:currentColor;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:100; background:var(--header);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid transparent; transition:border-color .3s ease, background-color .4s ease;
  }
  header.raised{border-bottom-color:var(--rule);}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:16px; height:64px;}
  .brand{text-decoration:none; transform:rotate(-1.5deg);}
  .brand .tape{font-size:15px; font-weight:600;}
  nav.main-nav{display:flex; gap:26px;}
  nav.main-nav a{text-decoration:none; font-size:16px; color:var(--ink-2); transition:color .2s ease;}
  nav.main-nav a:hover, nav.main-nav a.active{color:var(--ink);}
  nav.main-nav a.active{text-decoration:underline; text-decoration-color:var(--accent-strong); text-decoration-thickness:2px; text-underline-offset:7px;}
  .actions{display:flex; align-items:center; gap:6px;}
  .langs{display:flex; padding:3px; border-radius:100px; background:color-mix(in srgb, var(--ink) 7%, transparent);}
  .langs button{font-size:13px; font-weight:700; padding:4px 10px; border-radius:100px; color:var(--ink-3); transition:color .2s ease, background-color .2s ease;}
  .langs button:hover{color:var(--ink);}
  .langs button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .icon-btn{width:38px; height:38px; display:grid; place-items:center; border-radius:100px; color:var(--ink-2); position:relative; transition:background-color .2s ease, color .2s ease, transform .15s ease;}
  .icon-btn:hover{color:var(--ink); background:color-mix(in srgb, var(--ink) 7%, transparent);}
  .icon-btn:active{transform:scale(.92);}
  .theme-toggle svg{width:19px; height:19px; position:absolute; transition:opacity .25s ease, transform .4s var(--ease);}
  .theme-toggle .icon-sun{opacity:0; transform:rotate(-50deg) scale(.6);}
  [data-theme="dark"] .theme-toggle .icon-sun{opacity:1; transform:none;}
  [data-theme="dark"] .theme-toggle .icon-moon{opacity:0; transform:rotate(50deg) scale(.6);}
  .menu-toggle{display:none;}
  .menu-toggle .bars{width:18px; height:10px; position:relative;}
  .menu-toggle .bars span{position:absolute; left:0; right:0; height:2px; border-radius:2px; background:currentColor; transition:transform .35s var(--ease), top .35s var(--ease);}
  .menu-toggle .bars span:first-child{top:0;}
  .menu-toggle .bars span:last-child{top:8px;}
  .menu-toggle[aria-expanded="true"] .bars span:first-child{top:4px; transform:rotate(45deg);}
  .menu-toggle[aria-expanded="true"] .bars span:last-child{top:4px; transform:rotate(-45deg);}
  .mobile-nav{
    position:fixed; z-index:99; top:64px; left:0; right:0;
    background:var(--bg); border-bottom:1px solid var(--rule);
    padding:8px var(--gutter) 20px; display:flex; flex-direction:column;
    transform:translateY(-12px); opacity:0; visibility:hidden; pointer-events:none;
    transition:transform .35s var(--ease), opacity .2s ease, visibility 0s linear .35s;
  }
  .mobile-nav.open{transform:none; opacity:1; visibility:visible; pointer-events:auto; transition:transform .35s var(--ease), opacity .2s ease, visibility 0s;}
  .mobile-nav a{font-size:26px; font-weight:700; letter-spacing:-0.015em; text-decoration:none; padding:8px 0;}
  .scrim{position:fixed; inset:0; z-index:98; background:rgba(10,12,16,.25); opacity:0; pointer-events:none; transition:opacity .3s ease;}
  .scrim.open{opacity:1; pointer-events:auto;}

  /* ---------- Hero ---------- */
  .hero{padding-block:clamp(56px, 10vw, 112px) clamp(64px, 10vw, 120px);}
  .hero .host{transform:rotate(-2deg); margin-bottom:clamp(18px, 2.4vw, 28px);}
  h1{font-size:clamp(44px, 7.6vw, 100px); line-height:1; letter-spacing:-0.03em; font-weight:800;}
  #greet{white-space:nowrap;}
  .caret{
    display:inline-block; width:.06em; height:.78em; margin-left:.04em; vertical-align:-.04em;
    background:var(--accent-strong); animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .roles{font-size:clamp(20px, 2.2vw, 28px); font-weight:600; letter-spacing:-0.015em; color:var(--ink-2); margin-top:clamp(14px, 1.6vw, 20px);}
  .lede{font-size:clamp(18px, 1.6vw, 20px); color:var(--ink-2); max-width:48ch; margin-top:clamp(20px, 2.6vw, 30px);}
  .cta{display:flex; flex-wrap:wrap; align-items:center; gap:14px 28px; margin-top:32px;}
  .btn{
    display:inline-flex; align-items:center; text-decoration:none; font-weight:600; font-size:17px;
    padding:13px 26px; border-radius:100px; background:var(--ink); color:var(--bg);
    transition:background-color .2s ease, transform .15s ease;
  }
  .btn:hover{background:var(--accent);}
  [data-theme="dark"] .btn:hover{color:#0d1013;}
  .btn:active{transform:scale(.97);}

  /* ---------- Sections ---------- */
  section.block{padding-block:clamp(64px, 9vw, 112px); border-top:1px solid var(--rule); scroll-margin-top:64px;}
  h2{font-size:clamp(34px, 4.6vw, 56px); line-height:1.05; letter-spacing:-0.03em; font-weight:800; margin-bottom:clamp(24px, 3.4vw, 40px);}
  .sub{color:var(--ink-2); max-width:52ch;}

  /* About */
  .about{display:grid; grid-template-columns:5fr 7fr; gap:clamp(32px, 6vw, 88px); align-items:start;}
  .about .intro{font-size:clamp(20px, 1.9vw, 24px); line-height:1.45;}
  .about .intro strong{font-weight:700;}
  .interests{list-style:none; display:grid; grid-template-columns:1fr 1fr; gap:0 32px; margin-top:6px;}
  .interests li{border-top:1px solid var(--rule); padding-block:18px 24px;}
  .interests h3{font-size:19px; font-weight:700; letter-spacing:-0.01em; margin-bottom:4px;}
  .interests p{font-size:16px; color:var(--ink-2);}

  /* Home lab: an asset plate */
  .lab{display:grid; grid-template-columns:5fr 6fr; gap:clamp(32px, 6vw, 88px); align-items:center;}
  .plate{
    position:relative; background:var(--panel); border:1px solid var(--panel-edge); border-radius:8px;
    padding:30px 34px;
    background-image:
      radial-gradient(circle at 14px 14px, var(--hole) 3.5px, transparent 4.5px),
      radial-gradient(circle at calc(100% - 14px) 14px, var(--hole) 3.5px, transparent 4.5px),
      radial-gradient(circle at 14px calc(100% - 14px), var(--hole) 3.5px, transparent 4.5px),
      radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), var(--hole) 3.5px, transparent 4.5px);
    box-shadow:0 18px 40px -26px rgba(0,0,0,.35);
  }
  .plate .tape{transform:rotate(-1deg); margin-bottom:18px;}
  .plate dl{display:grid; grid-template-columns:auto 1fr; gap:10px 28px; font-size:17px;}
  .plate dt{font-family:var(--mono); font-size:14px; color:var(--ink-3); padding-top:2px;}
  .plate dd{font-weight:600;}

  /* Projects: the rack */
  .legend{display:flex; flex-wrap:wrap; gap:8px 24px; font-size:15px; color:var(--ink-2); margin:-12px 0 24px;}
  .legend span{display:inline-flex; align-items:center; gap:8px;}
  .rack{
    position:relative; background:var(--rack); border-radius:8px; padding:12px 30px; overflow-x:clip;
    display:flex; flex-direction:column; gap:6px;
  }
  .rack::before, .rack::after{
    content:""; position:absolute; top:12px; bottom:12px; width:6px;
    background:linear-gradient(var(--hole) 0 7px, transparent 7px) 0 0 / 6px 16px repeat-y;
  }
  .rack::before{left:12px;}
  .rack::after{right:12px;}
  .unit{
    position:relative; background:var(--panel); border:1px solid var(--panel-edge); border-radius:4px;
    display:grid; grid-template-columns:auto 190px minmax(0, 2.2fr) minmax(0, 1fr) 160px;
    align-items:center; gap:14px 22px; padding:16px 22px; min-height:72px;
  }
  .unit .tape{justify-self:start;}
  .unit .desc{font-size:16px; color:var(--ink-2); line-height:1.45;}
  .unit .tags{font-family:var(--mono); font-size:13px; color:var(--ink-3); line-height:1.4;}
  .unit .links{display:flex; justify-content:flex-end; gap:16px; font-size:16px; white-space:nowrap;}
  .led{width:10px; height:10px; border-radius:50%; background:var(--led-off); flex-shrink:0;
       box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); transition:background-color .25s ease, box-shadow .25s ease, opacity .07s linear;}
  .led.blip{opacity:.28;}
  .led.active{--on:var(--led-green);}
  .led.wip{--on:var(--led-amber);}
  .rack.booted .led.active, .rack.booted .led.wip, .legend .led.active, .legend .led.wip, .plate .led.active{
    background:var(--on); box-shadow:0 0 0 1px rgba(0,0,0,.12), 0 0 8px color-mix(in srgb, var(--on) 70%, transparent);
  }
  .rack.mounting .led{transition-delay:calc(var(--i, 0) * 70ms + 380ms);}

  .unit.big{grid-template-columns:auto 1fr auto; align-items:center; padding:26px 28px; gap:18px 28px;}
  .unit.big .main{display:flex; flex-direction:column; gap:12px; align-items:flex-start;}
  .unit.big .tape{font-size:16px;}
  .unit.big h3{font-size:clamp(34px, 4.4vw, 52px); font-weight:800; letter-spacing:-0.03em; line-height:1;}
  .unit.big .desc{font-size:17px; max-width:56ch;}
  .unit.big .row{display:flex; flex-wrap:wrap; align-items:center; gap:12px 22px;}
  .unit.big .btn{padding:10px 20px; font-size:16px;}
  .unit.big .logo{width:clamp(88px, 11vw, 132px); aspect-ratio:1;}
  .unit.big .logo img{width:100%; height:100%; object-fit:contain;}

  .unit.blank{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background-image:repeating-linear-gradient(90deg, transparent 0 14px, color-mix(in srgb, var(--ink) 9%, transparent) 14px 18px);
    background-size:60% 10px; background-repeat:no-repeat; background-position:center;
  }
  .unit.blank .note{font-size:15px; color:var(--ink-3); background:var(--panel); padding:0 6px;}

  /* Stack: tapes stuck on */
  .tapes{list-style:none; display:flex; flex-wrap:wrap; gap:14px 12px; max-width:900px;}
  .tapes .tape{font-size:16px; padding:5px 12px;}
  .tapes li:nth-child(3n+1) .tape{transform:rotate(-1.2deg);}
  .tapes li:nth-child(4n+2) .tape{transform:rotate(.9deg);}
  .tapes li:nth-child(5n) .tape{transform:rotate(-.4deg) translateY(2px);}

  /* Translating: the quote in both languages */
  .quote blockquote{max-width:22ch; font-size:clamp(30px, 4.4vw, 56px); font-weight:700; line-height:1.12; letter-spacing:-0.025em;}
  .quote .other{display:flex; align-items:baseline; gap:12px; margin-top:20px; font-size:clamp(18px, 1.8vw, 22px); color:var(--ink-2); max-width:44ch;}
  .quote .other .tape{font-size:12px; padding:1px 7px;}
  .tr-text{margin-top:clamp(28px, 4vw, 44px);}

  /* Contact */
  .big-mail{
    display:inline-block; font-size:clamp(32px, 6.4vw, 84px); font-weight:800; letter-spacing:-0.03em; line-height:1.1;
    overflow-wrap:anywhere; text-decoration:underline; text-decoration-thickness:.06em; text-underline-offset:.12em;
    text-decoration-color:var(--accent-strong); transition:color .2s ease;
  }
  .big-mail:hover{color:var(--accent);}
  .elsewhere{display:flex; flex-wrap:wrap; gap:14px 32px; margin-top:clamp(28px, 4vw, 44px); font-size:19px;}
  .elsewhere a{display:inline-flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; font-weight:600;}
  .elsewhere a:hover{color:var(--accent);}
  .elsewhere svg{width:20px; height:20px; flex-shrink:0;}
  .contact .sub{margin-bottom:clamp(24px, 3vw, 36px);}

  footer{border-top:1px solid var(--rule); padding-block:28px 40px; font-size:14px; color:var(--ink-3);}
  .frow{display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 32px;}

  /* ---------- Responsive ---------- */
  @media(max-width:1000px){
    nav.main-nav{display:none;}
    .menu-toggle{display:grid;}
    .unit{grid-template-columns:auto 170px minmax(0, 2fr) 150px;}
    .unit .tags{display:none;}
  }
  @media(min-width:1001px){ .mobile-nav, .scrim{display:none;} }
  @media(max-width:820px){
    .about, .lab{grid-template-columns:1fr;}
    .unit{grid-template-columns:auto 1fr; padding:16px 18px;}
    .unit .desc, .unit .links{grid-column:1 / -1;}
    .unit .links{justify-content:flex-start;}
    .unit .links:empty{display:none;}
    .unit .tags{display:block; grid-column:1 / -1; margin-top:-6px;}
    .unit.big{grid-template-columns:1fr;}
    .unit.big .led{position:absolute; top:18px; right:18px;}
    .unit.big .logo{order:-1; width:80px;}
    .rack{padding:10px 22px;}
    .rack::before{left:8px;} .rack::after{right:8px;}
  }
  @media(max-width:560px){
    .interests{grid-template-columns:1fr;}
    .plate{padding:26px 22px;}
    .plate dl{grid-template-columns:1fr; gap:2px;}
    .plate dd{margin-bottom:10px;}
    .unit.blank .note{display:none;}
  }


  /* ---------- Micro-interactions ----------
     Each one is small on its own; together they make the rack feel alive.
     All motion is either feedback to the visitor or a status signal. */
  :root{--spring:linear(0, 0.06, 0.186, 0.329, 0.466, 0.584, 0.682, 0.76, 0.821, 0.868, 0.903, 0.929, 0.949, 0.963, 0.973, 0.981, 0.986, 0.99, 0.993, 0.995, 0.997, 0.998, 0.998, 0.999, 1);}
  @supports not (transition-timing-function: linear(0, 1)){ :root{--spring:var(--ease);} }

  /* Links: a faint underline that draws in solid from the left */
  .tlink{
    text-decoration:none; padding-bottom:2px;
    background-image:linear-gradient(currentColor, currentColor), linear-gradient(color-mix(in srgb, currentColor 32%, transparent), color-mix(in srgb, currentColor 32%, transparent));
    background-size:0% 1.5px, 100% 1.5px; background-position:0 100%, 0 100%; background-repeat:no-repeat;
    transition:background-size .5s var(--spring);
  }
  .tlink:hover{background-size:100% 1.5px, 100% 1.5px;}

  /* Brand tape straightens when you point at it */
  .brand{transition:transform .55s var(--spring);}
  .brand .tape{transition:box-shadow .3s ease;}
  .brand:hover{transform:rotate(0deg) translateY(-1px);}
  .brand:hover .tape{box-shadow:0 1px 0 rgba(0,0,0,.08), 0 6px 12px -4px rgba(0,0,0,.25);}

  /* Nav indicator */
  nav.main-nav{position:relative;}
  nav.main-nav a.active{text-decoration:none;}
  .nav-ind{
    position:absolute; left:0; bottom:-9px; width:1px; height:2px; border-radius:2px;
    background:var(--accent-strong); transform-origin:0 0; opacity:0;
    transition:transform .55s var(--spring), opacity .25s ease;
  }

  /* Language switch: the selection slides */
  .langs{position:relative; display:grid; grid-template-columns:1fr 1fr;}
  .langs .thumb{
    position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border-radius:100px;
    background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.14);
    transition:transform .45s var(--spring), background-color .4s ease;
  }
  .langs[data-active="hu"] .thumb{transform:translateX(100%);}
  .langs button{position:relative; z-index:1; min-width:38px;}
  .langs button[aria-pressed="true"]{background:none; box-shadow:none;}

  /* Buttons lift a touch, press down on click */
  .btn{transition:background-color .2s ease, color .2s ease, transform .4s var(--spring);}
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:scale(.97); transition-duration:.08s;}

  /* Rack units */
  .unit{transition:transform .4s var(--spring), box-shadow .3s ease, background-color .4s ease, border-color .4s ease;}
  .unit:not(.blank):hover{transform:translateY(-2px); box-shadow:0 12px 26px -16px rgba(0,0,0,.45);}
  .plate{transition:background-color .4s ease, border-color .4s ease;}

  /* Home lab plate: real screws that turn when you hover */
  .plate{background-image:none;}
  .plate-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .plate-head .tape{margin-bottom:0;}
  .screw{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:var(--hole); box-shadow:inset 0 1px 1.5px rgba(0,0,0,.28);
    transform:rotate(var(--a)); transition:transform .7s var(--spring);
  }
  .screw::before, .screw::after{
    content:""; position:absolute; left:50%; top:50%; width:7px; height:1.6px; border-radius:1px;
    background:var(--panel); transform:translate(-50%, -50%);
  }
  .screw::after{transform:translate(-50%, -50%) rotate(90deg);}
  .screw.s1{top:9px; left:9px; --a:12deg;}
  .screw.s2{top:9px; right:9px; --a:-28deg;}
  .screw.s3{bottom:9px; left:9px; --a:40deg;}
  .screw.s4{bottom:9px; right:9px; --a:-6deg;}
  .plate:hover .screw{transform:rotate(calc(var(--a) + 90deg));}

  /* Stack tapes peel up when pointed at */
  .tapes .tape{transition:transform .45s var(--spring), box-shadow .3s ease;}
  .tapes li:hover .tape{transform:rotate(0deg) translateY(-3px); box-shadow:0 1px 0 rgba(0,0,0,.08), 0 9px 16px -6px rgba(0,0,0,.3);}

  /* Interests: the rule above each one lights up */
  .interests li{transition:border-color .3s ease;}
  .interests li:hover{border-top-color:var(--accent-strong);}

  /* Contact */
  .mail-row{display:flex; flex-wrap:wrap; align-items:center; gap:12px 22px;}
  .big-mail{transition:color .2s ease, text-decoration-thickness .35s var(--spring), text-underline-offset .35s var(--spring);}
  .big-mail:hover{text-decoration-thickness:.1em; text-underline-offset:.08em;}
  .copy{
    font-family:var(--mono); font-size:14px; font-weight:500; padding:6px 13px; border-radius:100px;
    border:1px solid var(--rule); color:var(--ink-2);
    transition:background-color .2s ease, color .2s ease, border-color .2s ease, transform .3s var(--spring);
  }
  .copy:hover{color:var(--ink); border-color:var(--ink-3);}
  .copy:active{transform:scale(.94); transition-duration:.08s;}
  .copy.done{background:var(--tape); color:var(--tape-ink); border-color:transparent; box-shadow:0 1px 0 rgba(0,0,0,.1), 0 2px 5px -1px rgba(0,0,0,.14);}
  .elsewhere svg{transition:transform .45s var(--spring);}
  .elsewhere a:hover svg{transform:translateY(-2px) rotate(-8deg);}

  /* Mobile menu items arrive one after another */
  .mobile-nav a{opacity:0; transform:translateY(-6px); transition:opacity .25s ease, transform .45s var(--spring);}
  .mobile-nav.open a{opacity:1; transform:none;}
  .mobile-nav.open a:nth-child(2){transition-delay:35ms;}
  .mobile-nav.open a:nth-child(3){transition-delay:70ms;}
  .mobile-nav.open a:nth-child(4){transition-delay:105ms;}
  .mobile-nav.open a:nth-child(5){transition-delay:140ms;}

  @media(prefers-reduced-motion:no-preference){
    /* Page load: the hostname tape gets stuck on, then the hero settles in */
    .hero > *{animation:rise .8s var(--spring) both; animation-delay:calc(var(--d, 0) * 85ms + 180ms);}
    .hero .host{animation:stick .75s var(--spring) both; animation-delay:60ms;}

    /* Rack: units slide in as if being mounted, LEDs follow */
    .rack:not(.booted) .unit{opacity:0;}
    .rack.mounting .unit{animation:mount .65s var(--spring) both; animation-delay:calc(var(--i, 0) * 70ms);}

    /* Hovering a unit triggers a burst of disk activity on its LED */
    .unit:hover .led.active, .unit:hover .led.wip{animation:activity .8s steps(1) 1;}
    /* The secret panel is locked */
    .unit.blank:hover{animation:locked .42s ease 1;}
    .copy.done{animation:pop .45s var(--spring);}
  }
  @keyframes rise{from{opacity:0; transform:translateY(14px);}}
  @keyframes stick{from{opacity:0; transform:translate(-6px, -18px) rotate(-10deg) scale(1.08);} to{opacity:1; transform:rotate(-2deg);}}
  @keyframes mount{from{opacity:0; transform:translateX(18px);}}
  @keyframes activity{0%, 25%, 50%, 75%{opacity:1;} 12%, 37%, 62%{opacity:.25;}}
  @keyframes locked{20%{transform:translateX(-3px);} 40%{transform:translateX(3px);} 60%{transform:translateX(-2px);} 80%{transform:translateX(2px);}}
  @keyframes pop{from{transform:scale(.85) rotate(-4deg);}}

  /* ---------- Preferences ---------- */
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .caret{animation:none;}
    *, *::before, *::after{transition-duration:.01ms !important; transition-delay:0s !important;}
  }
  @media(prefers-reduced-transparency:reduce){
    header{background:var(--bg); -webkit-backdrop-filter:none; backdrop-filter:none;}
  }
  @media(prefers-contrast:more){
    :root{--ink-2:#2f343c; --ink-3:#474d57; --rule:#868d97; --panel-edge:#868d97;}
    [data-theme="dark"]{--ink-2:#d0d4dc; --ink-3:#b0b6c2; --rule:#6f7787; --panel-edge:#6f7787;}
  }
</style>

      name:"Spotui", status:"active", tags:"Kotlin, Jetpack Compose",
      desc:{en:"Open-source Spotify client for Android. I contributed offline caching, lossless by default and the Canvas toggle.", hu:"Nyílt forráskódú Spotify kliens Androidra. Én az offline gyorsítótárat, az alapértelmezett lossless módot és a Canvas kapcsolót tettem bele."}
    },
    {
      name:"Spotnee", status:"wip", tags:"Kotlin, Jetpack Compose",
      desc:{en:"My own fork and rebrand of Spotui.", hu:"A Spotui saját forkja, saját arculattal."}
    },
    {
      name:"AlphaDroid", status:"active", tags:"Android, Linux",
      desc:{en:"Custom Android ROM focused on performance and a clean UI.", hu:"Egyedi Android ROM, a teljesítményre és a letisztult felületre fókuszálva."}
    },
    {
      name:"GPON Endpoint", status:"active", tags:"OpenWrt, Banana Pi",
      desc:{en:"Custom fiber (FTTH/GPON) edge router that replaces the ISP-locked gateway, authenticating through an SFP module.", hu:"Saját optikai (FTTH/GPON) peremrouter, ami SFP modulos hitelesítéssel váltja ki a szolgáltató által lezárt eszközt."}
    },
    {
      name:"Idő Jós", status:"active", tags:"HTML, JavaScript",
      desc:{en:"Simple weather prediction - fast, accurate, it'll be your favorite site...", hu:"Egyszerű idő jóslás - gyors, pontos, a kedvenc oldalad lesz..."},
      links:[{label:{en:"Predictor",hu:"Jósló"}, url:"https://pacuka.github.io/IdoJos/"},{label:"GitHub", url:"https://github.com/Pacuka/IdoJos"}]
    },
    {
      name:"Web Music", status:"active", tags:"HTML, JavaScript",
      desc:{en:"Self-built music player, mainly a side project - but feel free to give it a listen.", hu:"Sajátfejlesztésű zenelejátszó, elsősorban mellék projekt - de nyugodtan belehallgathatsz."},
      links:[{label:{en:"Player",hu:"Lejátszó"}, url:"https://pacuka.github.io/Music/"},{label:"GitHub", url:"https://github.com/Pacuka/Music"}]
    },
    {
      name:"LucaMail-PacalMail", status:"archived", tags:"JavaScript",
      desc:{en:"Modern, cross-platform open-source email client.", hu:"Modern, platformfüggetlen, nyílt forráskódú levelezőkliens."},
      links:[{label:"GitHub", url:"https://github.com/Pacuka/LucaMail-PacalMail"}]
    },
    { blank:true }
  ];

  const STACK = ["Docker","Debian","Caddy","Cloudflare","Headscale","OpenWrt","Go","Rust","Tauri","Wails","React","TypeScript","Kotlin","Jetpack Compose","Dart / Flutter","Python","Bash","Git"];

  const CONTACT = [
    {label:"Discord", url:"https://discord.com/user/711460576236404738", icon:"discord"},
    {label:"GitHub", url:"https://github.com/Pacuka", icon:"github"},
    {label:"YourSitee", url:"https://yoursit.ee/pacuka", icon:"yoursitee"}
  ];

  const $ = id => document.getElementById(id);
  const pick = (v, lang) => typeof v === "string" ? v : v[lang];
  const get = (obj, path) => path.split(".").reduce((o, k) => o && o[k], obj);
  const other = lang => lang === "en" ? "hu" : "en";
  const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let currentLang = "en";

  function linksHTML(links, lang){
    return (links || []).map(l => l.primary
      ? `<a class="btn" href="${l.url}">${pick(l.label, lang)}</a>`
      : `<a class="tlink" href="${l.url}">${pick(l.label, lang)}</a>`).join("");
  }

  function renderRack(lang){
    const t = LANG[lang].projects;
    $("legend").innerHTML = ["active","wip","archived"].map(s =>
      `<span><i class="led ${s}" aria-hidden="true"></i>${t[s]}</span>`).join("");
    $("rack").innerHTML = PROJECTS.map((p, i) => {
      if(p.blank) return `
        <div class="unit blank" style="--i:${i}">
          <span class="tape">${t.secret}</span>
          <span class="note">${t.reserved}</span>
          <i class="led" aria-hidden="true"></i>
        </div>`;
      const led = `<i class="led ${p.status}" style="--i:${i}" role="img" aria-label="${t[p.status]}"></i>`;
      if(p.big) return `
        <article class="unit big" style="--i:${i}">
          ${led}
          <div class="main">
            <span class="tape">${p.name.toLowerCase()}</span>
            <h3>${p.name}</h3>
            <p class="desc">${pick(p.desc, lang)}</p>
            <div class="row">${linksHTML(p.links, lang)}</div>
          </div>
          <div class="logo"><img src="${p.logo}" alt="${p.name} logo" width="132" height="132"></div>
        </article>`;
      return `
        <article class="unit" style="--i:${i}">
          ${led}
          <h3 class="tape">${p.name}</h3>
          <p class="desc">${pick(p.desc, lang)}</p>
          <span class="tags">${p.tags || ""}</span>
          <div class="links">${linksHTML(p.links, lang)}</div>
        </article>`;
    }).join("");
  }

  function applyText(lang){
    const t = LANG[lang], o = LANG[other(lang)];
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = get(t, el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = get(t, el.dataset.i18nHtml); });

    $("interests").innerHTML = t.about.interests.map(x => `<li><h3>${x.k}</h3><p>${x.v}</p></li>`).join("");
    $("lab-specs").innerHTML = t.lab.specs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    $("quote-main").textContent = t.tr.quote;
    $("quote-other").setAttribute("lang", other(lang));
    $("quote-other").innerHTML = `<span class="tape">${o.code}</span><span>${o.tr.quote}</span>`;

    $("greet-sr").textContent = t.hero.greetings[0];
    $("theme-toggle").setAttribute("aria-label", t.theme);
    menuToggle.setAttribute("aria-label", mobileNav.classList.contains("open") ? t.menuClose : t.menuOpen);
    document.querySelector(".langs").dataset.active = lang;
    document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
    document.documentElement.setAttribute("lang", lang);
  }

  function setLang(lang, persist){
    currentLang = lang;
    applyText(lang);
    renderRack(lang);
    if(rackBooted) $("rack").classList.add("booted");
    if(activityOn) watchLeds();
    reserveHeroHeight();
    placeNavInd();
    startGreetingTypewriter(lang);
    if(persist){
      try{ localStorage.setItem('pacuka-lang', lang); }catch(e){}
    }
  }

  /* The greetings differ in length, so the headline can wrap onto an extra
     line mid-animation. Reserve the height of the tallest variant so the
     content below never shifts. */
  function reserveHeroHeight(){
    const h1 = $('hero-title'), greet = $('greet');
    const shown = greet.textContent;
    h1.style.minHeight = '';
    let max = 0;
    LANG[currentLang].hero.greetings.forEach(g => {
      greet.textContent = g;
      max = Math.max(max, h1.getBoundingClientRect().height);
    });
    greet.textContent = shown;
    h1.style.minHeight = Math.ceil(max) + 'px';
  }
  let heroWidth = 0;
  new ResizeObserver(([entry]) => {
    const w = Math.round(entry.contentRect.width);
    if(w !== heroWidth){ heroWidth = w; reserveHeroHeight(); }
  }).observe($('top'));
  if(document.fonts) document.fonts.ready.then(reserveHeroHeight);

  let typewriterToken = 0;
  function startGreetingTypewriter(lang){
    const el = $('greet');
    const myToken = ++typewriterToken;
    const greetings = LANG[lang].hero.greetings;
    if(reduceMotion()){ el.textContent = greetings[0]; return; }

    /* Start fully typed so the headline reads correctly on first paint */
    let current = greetings[0], lastWord = current, charIndex = current.length, deleting = true;
    el.textContent = current;

    function pickWord(){
      let w;
      do { w = greetings[Math.floor(Math.random() * greetings.length)]; }
      while(w === lastWord && greetings.length > 1);
      lastWord = w;
      return w;
    }
    function tick(){
      if(myToken !== typewriterToken) return;
      if(!deleting){
        charIndex++;
        el.textContent = current.slice(0, charIndex);
        if(charIndex === current.length){ deleting = true; setTimeout(tick, 2200); return; }
        setTimeout(tick, 95);
      } else {
        charIndex--;
        el.textContent = current.slice(0, charIndex);
        if(charIndex === 0){ deleting = false; current = pickWord(); setTimeout(tick, 350); return; }
        setTimeout(tick, 45);
      }
    }
    setTimeout(tick, 2200);
  }

  /* Theme */
  const themeMeta = $('theme-color');
  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
  const syncThemeColor = () => themeMeta.setAttribute('content', isDark() ? '#1a1d22' : '#e9ebee');
  syncThemeColor();
  $('theme-toggle').addEventListener('click', () => {
    const next = isDark() ? 'light' : 'dark';
    if(next === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('pacuka-theme', next); }catch(e){}
    syncThemeColor();
  });

  document.querySelector('.langs').addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]');
    if(b && b.dataset.lang !== currentLang) setLang(b.dataset.lang, true);
  });

  /* Mobile menu */
  const menuToggle = $('menu-toggle');
  const mobileNav = $('mobile-nav');
  const scrim = $('scrim');
  function setMenu(open){
    mobileNav.classList.toggle('open', open);
    scrim.classList.toggle('open', open);
    menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuToggle.setAttribute('aria-label', open ? LANG[currentLang].menuClose : LANG[currentLang].menuOpen);
  }
  menuToggle.addEventListener('click', () => setMenu(!mobileNav.classList.contains('open')));
  scrim.addEventListener('click', () => setMenu(false));
  mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => setMenu(false)));
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && mobileNav.classList.contains('open')){ setMenu(false); menuToggle.focus(); }
  });
  window.matchMedia('(min-width: 1001px)').addEventListener('change', e => { if(e.matches) setMenu(false); });

  /* Header rule appears once the page has scrolled past its top */
  const header = $('topbar');
  const sentinel = document.createElement('div');
  sentinel.style.cssText = 'position:absolute;top:0;left:0;width:1px;height:8px;pointer-events:none;';
  document.body.prepend(sentinel);
  new IntersectionObserver(([entry]) => header.classList.toggle('raised', !entry.isIntersecting)).observe(sentinel);


  /* Nav: one indicator that slides to the section in view */
  const navInd = $('nav-ind');
  function placeNavInd(){
    const a = document.querySelector('nav.main-nav a.active');
    if(!a || !a.offsetParent){ navInd.style.opacity = 0; return; }
    navInd.style.transform = `translateX(${a.offsetLeft}px) scaleX(${a.offsetWidth})`;
    navInd.style.opacity = 1;
  }
  window.addEventListener('resize', placeNavInd, { passive:true });

  /* Copy the e-mail address */
  const copyBtn = $('copy-mail');
  let copyTimer;
  copyBtn.addEventListener('click', async () => {
    const t = LANG[currentLang].contact;
    let msg;
    try{ await navigator.clipboard.writeText('pacuka@etik.com'); msg = t.copied; copyBtn.classList.add('done'); }
    catch(e){ msg = t.copyFail; }
    copyBtn.textContent = msg;
    $('copy-status').textContent = msg;
    clearTimeout(copyTimer);
    copyTimer = setTimeout(() => {
      copyBtn.classList.remove('done');
      copyBtn.textContent = LANG[currentLang].contact.copy;
      $('copy-status').textContent = '';
    }, 1800);
  });

  /* Network activity: now and then a lit LED flickers, like real traffic.
     Only while the LED is on screen and the tab is visible. */
  const ledVisible = new Set();
  const ledSeen = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting ? ledVisible.add(e.target) : ledVisible.delete(e.target));
  });
  function watchLeds(){
    ledVisible.clear(); ledSeen.disconnect();
    document.querySelectorAll('.rack .led.active, .rack .led.wip, .plate .led.active').forEach(l => ledSeen.observe(l));
  }
  let activityOn = false;
  function startActivity(){
    if(activityOn || reduceMotion()) return;
    activityOn = true;
    watchLeds();
    (function loop(){
      setTimeout(() => {
        const pool = [...ledVisible].filter(l => l.isConnected && (l.closest('.plate') || $('rack').classList.contains('booted')));
        if(pool.length && !document.hidden){
          const led = pool[Math.floor(Math.random() * pool.length)];
          const blink = (n) => { led.classList.add('blip'); setTimeout(() => { led.classList.remove('blip'); if(n > 1) setTimeout(() => blink(n - 1), 90); }, 70); };
          blink(1 + Math.floor(Math.random() * 3));
        }
        loop();
      }, 600 + Math.random() * 1600);
    })();
  }

  /* The one orchestrated moment: when the rack scrolls into view, the
     status LEDs power on one after another, like a server booting. */
  let rackBooted = false;

  document.addEventListener("DOMContentLoaded", () => {
    let initialLang = "en";
    try{
      const saved = localStorage.getItem('pacuka-lang');
      if(saved === 'hu' || saved === 'en') initialLang = saved;
    }catch(e){}

    $("stack-list").innerHTML = STACK.map(s => `<li><span class="tape">${s}</span></li>`).join("");
    $("elsewhere").innerHTML = CONTACT.map(c => `<a href="${c.url}">${ICONS[c.icon]}<span>${c.label}</span></a>`).join("");
    setLang(initialLang, false);
    startActivity();

    const boot = new IntersectionObserver(([entry]) => {
      if(!entry.isIntersecting) return;
      rackBooted = true;
      const rack = $("rack");
      if(!reduceMotion()){
        rack.classList.add("mounting");
        setTimeout(() => rack.classList.remove("mounting"), PROJECTS.length * 70 + 1000);
      }
      rack.classList.add("booted");
      boot.disconnect();
      startActivity();
    }, { threshold: 0.2 });
    boot.observe($("rack"));

    const navLinks = document.querySelectorAll("nav.main-nav a");
    const spy = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(!entry.isIntersecting) return;
        navLinks.forEach(a => {
          const on = a.getAttribute("href") === "#" + entry.target.id;
          a.classList.toggle("active", on);
          if(on) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
        });
        placeNavInd();
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    ["about","homelab","projects","translating","contact"].forEach(id => spy.observe($(id)));
  });
</script>
